<svg xmlns="http://www.w3.org/2000/svg" width="848" height="313" viewBox="0 0 848 313" role="img" aria-labelledby="title description"><title id="title">Custom callouts in AnuPpuccin's Sleek layout</title><desc id="description">The real locally installed theme stylesheet supplies Mocha colors and the Sleek callout surface. The production CSSInjector detects that title-bar surface and styles the custom Project callout accordingly; the theme-owned Tip remains under the theme's cascade.</desc><defs><clipPath id="clip-1"><rect x="58" y="94.8" width="717" height="65" rx="0" fill="white" /></clipPath><clipPath id="clip-2"><rect x="57" y="57" width="719" height="103.8" rx="4" fill="white" /></clipPath><clipPath id="clip-3"><rect x="58" y="214.59" width="717" height="40" rx="0" fill="white" /></clipPath><clipPath id="clip-4"><rect x="57" y="176.8" width="719" height="78.8" rx="4" fill="white" /></clipPath><clipPath id="clip-5"><rect x="24" y="24" width="800" height="264.59" rx="12" fill="white" /></clipPath></defs><rect x="0" y="0" width="848" height="313" rx="12" fill="rgb(30, 30, 46)" /><rect x="24" y="24" width="800" height="264.59" rx="12" fill="rgb(30, 30, 46)" /><rect x="24.5" y="24.5" width="799" height="263.59" rx="11.5" fill="none" stroke="rgb(49, 50, 68)" stroke-width="1"/><g clip-path="url(#clip-5)"><rect x="57" y="57" width="719" height="103.8" rx="4" fill="rgba(24, 24, 37, 0.4)" /><rect x="57.5" y="57.5" width="718" height="102.8" rx="3.5" fill="none" stroke="rgba(167.02, 138.99, 249.98, 0.4)" stroke-width="1"/><g clip-path="url(#clip-2)"><rect x="58" y="58" width="717" height="36.8" rx="0" fill="rgba(167, 139, 250, 0.16)" /><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="rgb(167, 139, 250)" stroke-width="1.75px" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero" opacity="1" transform="matrix(0.75 0 0 0.75 66 67.390625)"><path d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1