The accent and background appear on</text><text x="66" y="145.8" fill="rgb(198, 208, 245)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="16px" font-weight="400" font-style="normal" textLength="86.25" lengthAdjust="spacingAndGlyphs" xml:space="preserve">the title bar.</text></g></g><rect x="57" y="176.8" width="719" height="78.8" rx="4" fill="rgba(24, 24, 37, 0.4)" /><rect x="57.5" y="177.3" width="718" height="77.8" rx="3.5" fill="none" stroke="rgba(137.04, 219.99, 234.98, 0.4)" stroke-width="1"/><g clip-path="url(#clip-4)"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="rgb(137, 220, 235)" stroke-width="1.75px" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero" opacity="1" transform="matrix(0.75 0 0 0.75 66 187.1875)"><path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4" fill="none" stroke="rgb(137, 220, 235)" stroke-width="1.75px" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero" opacity="1"/></g><text x="88" y="201.8" fill="rgb(137, 220, 235)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="16px" font-weight="500" font-style="normal" textLength="171.41" lengthAdjust="spacingAndGlyphs" xml:space="preserve">A theme-controlled Tip</text><g clip-path="url(#clip-3)"><text x="66" y="240.59" fill="rgb(198, 208, 245)" font-