name: Release

on:
    push:
        tags:
            - "[0-9]+.[0-9]+.[0-9]+"

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            # Refuse to publish a tag that doesn't match the version files.
            # Obsidian requires the release tag to equal manifest.json's version
            # exactly, so a mismatch here would ship a broken update.
            - name: Verify version files match the tag
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  manifest=$(jq -r .version manifest.json)
                  package=$(jq -r .version package.json)

                  if [ "$manifest" != "$tag" ]; then
                      echo "::error::manifest.json version is '$manifest' but the tag is '$tag'."
                      exit 1
                  fi

                  if [ "$package" != "$tag" ]; then
                      echo "::error::package.json version is '$package' but the tag is '$tag'."
                      exit 1
                  fi

                  if [ "$(jq -r --arg v "$tag" 'has($v)' versions.json)" != "true" ]; then
                      echo "::error::versions.json has no entry for '$tag'."
                      exit 1
                  fi

                  echo "Version files agree on $tag."

            - uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "npm"

            - run: npm ci
            - run: npm run build
            - run: npm run lint
            - run: npm test

            # The locale JSON served from this tag must be byte-identical to the
            # checksums compiled into the main.js built above, or every download
            # fails verification for this entire version. `npm run build` already
            # regenerates both; this proves the result is what was committed.
            - name: Locale data is in sync
              run: |
                  git diff --exit-code locales src/i18n/localeManifest.ts \
                      || { echo "::error::locales/ is stale — run npm run i18n:generate and commit."; exit 1; }

            # main.js is the only file Obsidian downloads to install or update
            # the plugin, and icon metadata makes it easy to grow it by a
            # megabyte without noticing. The ceiling is deliberately close to
            # the current size so a careless import trips it here rather than
            # in users' vaults; raise it consciously when a feature earns it.
            # Raised from 3 MiB for Tabler Icons, whose two search indexes are
            # 357 KB between them for 5,130 icons. Raised again to 4 MiB for
            # 2.9.0's custom commands feature, Callout Manager import support,
            # and Palette Editor enhancements. Cut to 2 MiB once the 31
            # non-English locales moved out of the bundle and became downloads,
            # which took main.js from 3.70 MiB to 1.70 MiB.
            - name: Check bundle size
              run: |
                  limit=2097152  # 2 MiB
                  size=$(wc -c < main.js)
                  printf 'main.js is %s bytes (%.2f MiB), limit %s bytes.\n' \
                      "$size" "$(echo "scale=2; $size/1048576" | bc)" "$limit"
                  if [ "$size" -gt "$limit" ]; then
                      echo "::error::main.js exceeds the $limit byte budget."
                      exit 1
                  fi

            - name: Attest main.js
              uses: actions/attest-build-provenance@v2
              with:
                  subject-path: main.js

            - name: Attest styles.css
              uses: actions/attest-build-provenance@v2
              with:
                  subject-path: styles.css

            # GitHub's tag-push webhook can fire before the tag is visible to
            # the REST API. If action-gh-release runs into that gap, it can't
            # resolve the tag and creates the release under a throwaway
            # "untagged-..." name that vanishes once the tag does propagate.
            # Poll the real condition instead of guessing a fixed delay.
            - name: Wait for tag to be visible via the API
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  for i in $(seq 1 15); do
                      if gh api "repos/${{ github.repository }}/git/ref/tags/$tag" >/dev/null 2>&1; then
                          echo "Tag $tag is visible via the API."
                          exit 0
                      fi
                      echo "Tag not yet visible, retrying ($i/15)..."
                      sleep 2
                  done
                  echo "::error::Tag $tag never became visible via the GitHub API."
                  exit 1

            # Published as a draft on purpose: the /release skill writes the
            # user-facing notes and flips it public. A failure mid-way leaves a
            # draft rather than a half-finished release.
            - name: Create release
              uses: softprops/action-gh-release@v2
              with:
                  name: ${{ github.ref_name }}
                  draft: true
                  generate_release_notes: true
                  fail_on_unmatched_files: true
                  files: |
                      main.js
                      styles.css
                      manifest.json
