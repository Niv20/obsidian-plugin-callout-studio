<svg xmlns="http://www.w3.org/2000/svg" width="848" height="287" viewBox="0 0 848 287" role="img" aria-labelledby="title description"><title id="title">Heading and inline callouts in a note</title><desc id="description">The plugin's actual reading-view processors transform the Markdown heading token and both inline tokens. The colored Tip heading remains an h2 element, Warning uses its registered name, and Note displays the custom inline text, all styled through the production CSS in dark mode.</desc><defs><clipPath id="clip-1"><rect x="24" y="24" width="800" height="238.98" rx="12" fill="white" /></clipPath></defs><rect x="0" y="0" width="848" height="287" rx="12" fill="rgb(28, 28, 28)" /><rect x="24" y="24" width="800" height="238.98" rx="12" fill="rgb(28, 28, 28)" /><rect x="24.5" y="24.5" width="799" height="237.98" rx="11.5" fill="none" stroke="rgb(51, 51, 51)" stroke-width="1"/><g clip-path="url(#clip-1)"><rect x="57" y="68.69" width="719" height="40.14" rx="4" fill="rgba(83.07, 222.99, 220.99, 0.12)" /><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="rgb(83, 223, 221)" stroke-width="1.75px" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero" opacity="1" transform="matrix(0.974609375 0 0 0.974609375 67 76.87045288085938)"><path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4" fill="none" stroke="rgb(83, 223, 221)" stroke-width="1.75px" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero" opacity="1"/></g><text x="98.56" y="97.92" fill="rgb(83, 223, 221)" font-family="&quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="23.392px" font-weight="680" font-style="normal" textLength="168.9" lengthAdjust="spacingAndGlyphs" xml:space="preserve">My heading title</text><text x="57" y="142.83" fill="rgb(218, 218, 218)" font-family="&quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="16px" font-weight="400" font-style="normal" textLength="504.27" lengthAdjust="spacingAndGlyphs" xml:space="preserve">A heading callout introduces a section while keeping its heading level.</text><text x="57" y="182.83" fill="rgb(218, 218, 218)" font-family="&quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="16px" font-weight="400" font-style="normal" textLength="239.44" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Remember to check the settings </text><rect x="296.44" y="166.38" width="89.09" height="21.59" rx="10.8" fill="rgba(233.02, 150.99, 62.99, 0.12)" /><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="rgb(233, 151, 63)" stroke-width="1.75px" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero" opacity="1" transform="matrix(0.599609375 0 0 0.599609375 303.625 169.96875)"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" fill="none" stroke="rgb(233, 151, 63)" stroke-width="1.75px" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero" opacity="1"/><path d="M12 9v4" fill="none" stroke="rgb(233, 151, 63)" stroke-width="1.75px" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero" opacity="1"/><path d="M12 17h.01" fill="none" stroke="rgb(233, 151, 6