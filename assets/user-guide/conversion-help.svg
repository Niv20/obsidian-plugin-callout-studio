0" fill="rgb(51, 51, 51)" /><text x="382" y="358.56" fill="rgb(218, 218, 218)" font-family="monospace" font-size="13.995px" font-weight="400" font-style="normal" textLength="117.55" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Word type Word</text><rect x="41" y="371.25" width="333" height="34.69" rx="0" fill="rgb(40, 40, 40)" /><rect x="41" y="371.25" width="333" height="1" rx="0" fill="rgb(51, 51, 51)" /><text x="49" y="393.75" fill="rgb(218, 218, 218)" font-family="monospace" font-size="13.995px" font-weight="400" font-style="normal" textLength="193.1" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Word [!type]{Text} Word</text><rect x="374" y="371.25" width="333" height="34.69" rx="0" fill="rgb(40, 40, 40)" /><rect x="374" y="371.25" width="333" height="1" rx="0" fill="rgb(51, 51, 51)" /><text x="382" y="393.75" fill="rgb(218, 218, 218)" font-family="monospace" font-size="13.995px" font-weight="400" font-style="normal" textLength="117.55" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Word Text Word</text><rect x="41.5" y="418.44" width="665" height="53.38" rx="7.5" fill="none" stroke="rgb(51, 51, 51)" stroke-width="1"/><text x="54" y="440.94" fill="rgb(179, 179, 179)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="13.995px" font-weight="400" font-style="normal" textLength="622.84" lengthAdjust="spacingAndGlyphs" xml:space="preserve">We recommend backing up your vault before converting. This edits the original notes and cannot</text><text x="54" y="459.13" fill="rgb(179, 179, 179)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="13.995px" font-weight="400" font-style="normal" textLength="181.91" lengthAdjust="spacingAndGlyphs" xml:space="preserve">be undone in Callout Studio.</text></g><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="rgb(218, 218, 218)" stroke-width="1.75px" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero" opacity="1" transform="matrix(0.75 0 0 0.75 695 35)"><path d="M18 6 6 18" fill="none" stroke="rgb(218, 218, 218)" stroke-width="1.75px" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero" opacity="1"/><path d="m6 6 12 12" fill="none" stroke="rgb(218, 218, 218)" stroke-width="1.75px" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero" opacity="1"/></g></g></svg>
