<svg xmlns="http://www.w3.org/2000/svg" width="748" height="514" viewBox="0 0 748 514" role="img" aria-labelledby="title description"><title id="title">About conversion</title><desc id="description">The actual conversion-help modal shows the production Before/After examples and backup guidance.</desc><defs><clipPath id="clip-1"><rect x="25" y="80" width="698" height="408.31" rx="0" fill="white" /></clipPath><clipPath id="clip-2"><rect x="24" y="24" width="700" height="465.31" rx="12" fill="white" /></clipPath></defs><rect x="0" y="0" width="748" height="514" rx="12" fill="rgb(28, 28, 28)" /><rect x="24" y="24" width="700" height="465.31" rx="12" fill="rgb(28, 28, 28)" /><rect x="24.5" y="24.5" width="699" height="464.31" rx="11.5" fill="none" stroke="rgb(85, 85, 85)" stroke-width="1"/><g clip-path="url(#clip-2)"><rect x="25" y="79" width="698" height="1" rx="0" fill="rgb(51, 51, 51)" /><text x="41" y="61" fill="rgb(218, 218, 218)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="20px" font-weight="600" font-style="normal" textLength="161.19" lengthAdjust="spacingAndGlyphs" xml:space="preserve">About conversion</text><g clip-path="url(#clip-1)"><text x="41" y="111" fill="rgb(218, 218, 218)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="15px" font-weight="400" font-style="normal" textLength="624.14" lengthAdjust="spacingAndGlyphs" xml:space="preserve">If you plan to stop using Callout Studio or move your vault to an app without it, convert your</text><text x="41" y="130.5" fill="rgb(218, 218, 218)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="15px" font-weight="400" font-style="normal" textLength="343.01" lengthAdjust="spacingAndGlyphs" xml:space="preserve">heading and inline callouts to standard Markdown.</text><text x="41" y="165" fill="rgb(218, 218, 218)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="15px" font-weight="400" font-style="normal" textLength="660.9" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Select the replacements to apply. Click the pencil or replacement text to edit, then press Enter or</text><text x="41" y="184.5" fill="rgb(218, 218, 218)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="15px" font-weight="400" font-style="normal" textLength="663.04" lengthAdjust="spacingAndGlyphs" xml:space="preserve">click away to save. Use the reset icon to discard a draft or restore the default replacement. Notes</text><text x="41" y="204" fill="rgb(218, 218, 218)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="15px" font-weight="400" font-style="normal" textLength="628.31" lengthAdjust="spacingAndGlyphs" xml:space="preserve">change only after you choose Convert selected and confirm. Heading links update with their</text><text x="41" y="223.5" fill="rgb(218, 218, 218)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="15px" font-weight="400" font-style="normal" textLength="129.25" lengthAdjust="spacingAndGlyphs" xml:space="preserve">selected headings.</text><text x="49" y="257" fill="rgb(179, 179, 179)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="13.995px" font-weight="400" font-style="normal" textLength="42.44" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Before</text><text x="382" y="257" fill="rgb(179, 179, 179)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="13.995px" font-weight="400" font-style="normal" textLength="31.84" lengthAdjust="spacingAndGlyphs" xml:space="preserve">After</text><rect x="41" y="265.69" width="333" height="35.19" rx="0" fill="rgb(