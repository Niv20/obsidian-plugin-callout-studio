<svg xmlns="http://www.w3.org/2000/svg" width="608" height="520" viewBox="0 0 608 520" role="img" aria-labelledby="title description"><title id="title">About conversion</title><desc id="description">The actual conversion-help modal shows the production Before/After examples and backup guidance.</desc><defs><clipPath id="clip-1"><rect x="25" y="67.75" width="558" height="426.44" rx="0" fill="white" /></clipPath><clipPath id="clip-2"><rect x="24" y="24" width="560" height="471.19" rx="12" fill="white" /></clipPath></defs><rect x="0" y="0" width="608" height="520" rx="12" fill="rgb(28, 28, 28)" /><rect x="24" y="24" width="560" height="471.19" rx="12" fill="rgb(28, 28, 28)" /><rect x="24.5" y="24.5" width="559" height="470.19" rx="11.5" fill="none" stroke="rgb(63, 63, 63)" stroke-width="1"/><g clip-path="url(#clip-2)"><text x="41" y="56" fill="rgb(218, 218, 218)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="15px" font-weight="600" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="125.47" lengthAdjust="spacing" xml:space="preserve">About conversion</text><g clip-path="url(#clip-1)"><text x="41" y="86.75" fill="rgb(218, 218, 218)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="15px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="517.25" lengthAdjust="spacing" xml:space="preserve">If you plan to stop using Callout Studio or move your vault to an app without</text><text x="41" y="106.25" fill="rgb(218, 218, 218)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="15px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="449.89" lengthAdjust="spacing" xml:space="preserve">it, convert your heading and inline callouts to standard Markdown.</text><text x="41" y="140.75" fill="rgb(218, 218, 218)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="15px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="492.27" lengthAdjust="spacing" xml:space="preserve">Select the replacements to apply. Click the pencil or replacement text to</text><text x="41" y="160.25" fill="rgb(218, 218, 218)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="15px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="508.25" lengthAdjust="spacing" xml:space="preserve">edit, then press Enter or click away to save. Use the reset icon to discard a</text><text x="41" y="179.75" fill="rgb(218, 218, 218)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="15px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="525.42" lengthAdjust="spacing" xml:space="preserve">draft or restore the default replacement. Notes change only after you choose</text><text x="41" y="199.25" fill="rgb(218, 218, 218)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="15px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="484.91" lengthAdjust="spacing" xml:space="preserve">Convert selected and confirm. Heading links update with their selected</text><text x="41" y="218.75" fill="rgb(218, 218, 218)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="15px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="66.68" lengthAdjust="spacing" xml:space="preserve">headings.</text><rect x="40.5" y="237.75" width="527" height="171.94" rx="8.5" fill="none" stroke="rgb(51, 51, 51)" stroke-width="1"/><rect x="41" y="238.25" width="526" height="170.94" rx="8" fill="rgb(35, 35, 35)" /><text x="49" y="260.25" fill="rgb(179, 179, 179)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="13.995px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="42.44" lengthAdjust="spacing" xml:space="preserve">Before</text><text x="312" y="260.25" fill="rgb(179, 179, 179)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="13.995px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="31.84" lengthAdjust="spacing" xml:space="preserve">After</text><rect x="41" y="268.44" width="263" height="1" rx="0" fill="rgb(51, 51, 51)" /><text x="49" y="291.44" fill="rgb(218, 218, 218)" font-family="monospace" font-size="13.995px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="75.57" lengthAdjust="spacing" xml:space="preserve"># [!type]</text><rect x="304" y="268.44" width="263" height="1" rx="0" fill="rgb(51, 51, 51)" /><text x="312" y="291.44" fill="rgb(218, 218, 218)" font-family="monospace" font-size="13.995px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="50.38" lengthAdjust="spacing" xml:space="preserve"># type</text><rect x="41" y="303.63" width="263" height="1" rx="0" fill="rgb(51, 51, 51)" /><text x="49" y="326.63" fill="rgb(218, 218, 218)" font-family="monospace" font-size="13.995px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="125.94" lengthAdjust="spacing" xml:space="preserve"># [!type] Title</text><rect x="304" y="303.63" width="263" height="1" rx="0" fill="rgb(51, 51, 51)" /><text x="312" y="326.63" fill="rgb(218, 218, 218)" font-family="monospace" font-size="13.995px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="58.78" lengthAdjust="spacing" xml:space="preserve"># Title</text><rect x="41" y="338.81" width="263" height="1" rx="0" fill="rgb(51, 51, 51)" /><text x="49" y="361.81" fill="rgb(218, 218, 218)" font-family="monospace" font-size="13.995px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="142.73" lengthAdjust="spacing" xml:space="preserve">Word [!type] Word</text><rect x="304" y="338.81" width="263" height="1" rx="0" fill="rgb(51, 51, 51)" /><text x="312" y="361.81" fill="rgb(218, 218, 218)" font-family="monospace" font-size="13.995px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="117.55" lengthAdjust="spacing" xml:space="preserve">Word type Word</text><rect x="41" y="374" width="263" height="1" rx="0" fill="rgb(51, 51, 51)" /><text x="49" y="397" fill="rgb(218, 218, 218)" font-family="monospace" font-size="13.995px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="193.1" lengthAdjust="spacing" xml:space="preserve">Word [!type]{Text} Word</text><rect x="304" y="374" width="263" height="1" rx="0" fill="rgb(51, 51, 51)" /><text x="312" y="397" fill="rgb(218, 218, 218)" font-family="monospace" font-size="13.995px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="117.55" lengthAdjust="spacing" xml:space="preserve">Word Text Word</text><text x="41" y="439.19" fill="rgb(233, 151, 63)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="15px" font-weight="600" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="505.28" lengthAdjust="spacing" xml:space="preserve">We recommend backing up your vault before converting. This edits the</text><text x="41" y="458.69" fill="rgb(233, 151, 63)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="15px" font-weight="600" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="385.95" lengthAdjust="spacing" xml:space="preserve">original notes and cannot be undone in Callout Studio.</text></g><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="rgb(218, 218, 218)" stroke-width="2px" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero" opacity="1" transform="matrix(0.6666666666666666 0 0 0.6666666666666666 557 35)"><path d="M18 6 6 18" fill="none" stroke="rgb(218, 218, 218)" stroke-width="2px" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero" opacity="1"/><path d="m6 6 12 12" fill="none" stroke="rgb(218, 218, 218)" stroke-width="2px" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero" opacity="1"/></g></g></svg>
