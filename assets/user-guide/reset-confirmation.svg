<svg xmlns="http://www.w3.org/2000/svg" width="608" height="385" viewBox="0 0 608 385" role="img" aria-labelledby="title description"><title id="title">Reset everything confirmation</title><desc id="description">The real Danger zone action computes the inventory and note-reference count from synthetic callouts and notes, then opens its actual confirmation, with the brush mascot scared beside the heading. The acknowledgement stays unticked; no reset is performed.</desc><defs><clipPath id="clip-1"><rect x="25" y="105" width="558" height="193" rx="0" fill="white" /></clipPath><clipPath id="clip-2"><rect x="24" y="24" width="560" height="337" rx="12" fill="white" /></clipPath></defs><rect x="0" y="0" width="608" height="385" rx="12" fill="rgb(28, 28, 28)" /><rect x="24" y="24" width="560" height="337" rx="12" fill="rgb(28, 28, 28)" /><rect x="24.5" y="24.5" width="559" height="336" rx="11.5" fill="none" stroke="rgb(63, 63, 63)" stroke-width="1"/><g clip-path="url(#clip-2)"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="rgb(218, 218, 218)" stroke-width="2px" stroke-linecap="round" stroke-linejoin="round" overflow="visible" aria-hidden="true" fill-rule="nonzero" clip-rule="nonzero" opacity="1" transform="matrix(2 0 0 2 41 41)"><path d="M6.4 24.2C9.2 23.4 12.4 25 15.2 24" stroke-width="2.4px" pathLength="1" stroke-dasharray="1 1" opacity="0" fill="none" stroke="rgb(138, 92, 245)" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero"/><g transform="translate(0.542 0.32) rotate(8 12 13) translate(12 22) scale(0.98 0.97) translate(-12 -22)" fill="none" stroke="rgb(218, 218, 218)" stroke-width="2px" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero" opacity="1"><path d="M18.376 2.622a1 1 0 1 1 3.002 3.002L17.36 9.643a.5.5 0 0 0 0 .707l.944.944a2.41 2.41 0 0 1 0 3.408l-.944.944a.5.5 0 0 1-.707 0L8.354 7.348a.5.5 0 0 1 0-.707l.944-.944a2.41 2.41 0 0 1 3.408 0l.944.944a.5.5 0 0 0 .707 0z" fill="none" stroke="rgb(218, 218, 218)" stroke-width="2px" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero" opacity="1"/><path d="M9 8c-1.804 2.71-3.97 3.46-6.583 3.948a.507.507 0 0 0-.302.819l7.32 8.883a1 1 0 0 0 1.185.204C12.735 20.405 16 16.792 16 15" fill="none" stroke="rgb(218, 218, 218)" stroke-width="2px" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero" opacity="1"/><path d="M7.972 16.55C8.911 15.769 9.472 17.892 10.568 17.102" fill="none" fill-opacity="0" stroke="rgb(218, 218, 218)" stroke-width="2px" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero" opacity="1"/><path d="M8.468 13.212L8.468 13.212L8.469 13.213" stroke-width="2.75px" fill="none" stroke="rgb(218, 218, 218)" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero" opacity="1"/><path d="M11.748 14.107L11.748 14.107L11.749 14.107" stroke-width="2.75px" fill="none" stroke="rgb(218, 218, 218)" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero" opacity="1"/><circle r="0" stroke="none" fill="rgb(138, 92, 245)" opacity="0" cx="6.424" cy="14.624" stroke-width="2px" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero"/><circle r="0" stroke="none" fill="rgb(138, 92, 245)" opacity="0" cx="12.941" cy="16.195" stroke-width="2px" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero"/></g><g stroke="none" fill="rgb(138, 92, 245)" stroke-width="2px" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero" opacity="1"><circle cx="5.964" cy="9.707" r="0.588" opacity="1" fill="rgb(138, 92, 245)" stroke="none" stroke-width="2px" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero"/></g><circle fill="none" stroke-width="0.7px" r="0" opacity="0" stroke="rgb(138, 92, 245)" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero"/></g><text x="101" y="60.8" fill="rgb(218, 218, 218)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="15px" font-weight="600" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="120.98" lengthAdjust="spacing" xml:space="preserve">Reset everything</text><text x="101" y="80.3" fill="rgb(179, 179, 179)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="13px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="281.44" lengthAdjust="spacing" xml:space="preserve">Take a moment to appreciate what you've built</text><g clip-path="url(#clip-1)"><text x="41" y="120" fill="rgb(218, 218, 218)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="15px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="204.76" lengthAdjust="spacing" xml:space="preserve">All of it is about to be deleted:</text><circle cx="54.5" cy="143.25" r="2.5" fill="rgb(102, 102, 102)"/><text x="65" y="147.5" fill="rgb(218, 218, 218)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="15px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="166.56" lengthAdjust="spacing" xml:space="preserve">3 custom callout type(s)</text><circle cx="54.5" cy="166.75" r="2.5" fill="rgb(102, 102, 102)"/><text x="65" y="171" fill="rgb(218, 218, 218)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="15px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="147" lengthAdjust="spacing" xml:space="preserve">8 callout reference(s)</text><text x="41" y="208.5" fill="rgb(218, 218, 218)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="15px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="508.73" lengthAdjust="spacing" xml:space="preserve">Don't worry: before resetting, we save a backup of your current setup. You</text><text x="41" y="228" fill="rgb(218, 218, 218)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="15px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="508.13" lengthAdjust="spacing" xml:space="preserve">can bring it back at any time with Restore an earlier version in the settings.</text><text x="41" y="262.5" fill="rgb(218, 218, 218)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="15px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="500.75" lengthAdjust="spacing" xml:space="preserve">If you use a sync service, the reset might travel to your other devices too.</text></g><rect x="41.5" y="322" width="14" height="14" rx="3.5" fill="none" stroke="rgb(102, 102, 102)" stroke-width="1"/><text x="66" y="334.25" fill="rgb(218, 218, 218)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="15px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="186.71" lengthAdjust="spacing" xml:space="preserve">I have read and understood</text><rect x="367.58" y="314" width="65.61" height="30" rx="5" fill="rgb(51, 51, 51)" /><text x="379.58" y="334" fill="rgb(218, 218, 218)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="13px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="41.6" lengthAdjust="spacing" xml:space="preserve">Cancel</text><g opacity="0.7"><rect x="441.19" y="314" width="125.81" height="30" rx="5" fill="rgba(251.01, 69.99, 75.99, 0.1)" /><text x="453.19" y="334" fill="rgb(251, 70, 76)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="13px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="101.81" lengthAdjust="spacing" xml:space="preserve">Reset everything</text></g><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="rgb(218, 218, 218)" stroke-width="2px" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero" opacity="1" transform="matrix(0.6666666666666666 0 0 0.6666666666666666 557 35)"><path d="M18 6 6 18" fill="none" stroke="rgb(218, 218, 218)" stroke-width="2px" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero" opacity="1"/><path d="m6 6 12 12" fill="none" stroke="rgb(218, 218, 218)" stroke-width="2px" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero" opacity="1"/></g></g></svg>
