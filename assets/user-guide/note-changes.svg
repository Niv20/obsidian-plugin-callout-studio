<svg xmlns="http://www.w3.org/2000/svg" width="608" height="430" viewBox="0 0 608 430" role="img" aria-labelledby="title description"><title id="title">Update your notes before saving</title><desc id="description">The production NoteChangesModal asks about an Idea callout renamed to Insight whose test ID was removed, with illustrative note counts from synthetic data. Both changes are listed above one question, with Leave them as they are chosen on opening; nothing is saved and no note is edited.</desc><defs><clipPath id="clip-1"><rect x="444.59" y="296.44" width="47.41" height="16" rx="0" fill="white" /></clipPath><clipPath id="clip-2"><rect x="444.59" y="296.44" width="47.41" height="16" rx="0" fill="white" /></clipPath><clipPath id="clip-3"><rect x="25" y="73.5" width="558" height="276.09" rx="0" fill="white" /></clipPath><clipPath id="clip-4"><rect x="24" y="24" width="560" height="381.59" rx="12" fill="white" /></clipPath></defs><rect x="0" y="0" width="608" height="430" rx="12" fill="rgb(28, 28, 28)" /><rect x="24" y="24" width="560" height="381.59" rx="12" fill="rgb(28, 28, 28)" /><rect x="24.5" y="24.5" width="559" height="380.59" rx="11.5" fill="none" stroke="rgb(63, 63, 63)" stroke-width="1"/><g clip-path="url(#clip-4)"><rect x="25" y="72.5" width="558" height="1" rx="0" fill="rgb(51, 51, 51)" /><text x="41" y="56" fill="rgb(218, 218, 218)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="15px" font-weight="600" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="140" lengthAdjust="spacing" xml:space="preserve">Update your notes?</text><rect x="25" y="349.59" width="558" height="55" rx="0" fill="rgb(28, 28, 28)" /><rect x="25" y="349.59" width="558" height="1" rx="0" fill="rgb(51, 51, 51)" /><rect x="375.39" y="362.59" width="71.61" height="30" rx="5" fill="rgb(51, 51, 51)" /><rect x="375.89" y="363.09" width="70.61" height="29" rx="4.5" fill="none" stroke="rgb(51, 51, 51)" stroke-width="1"/><text x="390.39" y="382.59" fill="rgb(218, 218, 218)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="13px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="41.61" lengthAdjust="spacing" xml:space="preserve">Cancel</text><rect x="455" y="362.59" width="112" height="30" rx="5" fill="rgb(138, 92, 245)" /><text x="469" y="382.59" fill="rgb(255, 255, 255)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="13px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="84" lengthAdjust="spacing" xml:space="preserve">Save changes</text><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="rgb(218, 218, 218)" stroke-width="2px" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero" opacity="1" transform="matrix(0.6666666666666666 0 0 0.6666666666666666 557 35)"><path d="M18 6 6 18" fill="none" stroke="rgb(218, 218, 218)" stroke-width="2px" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero" opacity="1"/><path d="m6 6 12 12" fill="none" stroke="rgb(218, 218, 218)" stroke-width="2px" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero" opacity="1"/></g><g clip-path="url(#clip-3)"><text x="59.75" y="104.5" fill="rgb(218, 218, 218)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="15px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="478" lengthAdjust="spacing" xml:space="preserve">You changed the display name from &quot;Idea&quot; to &quot;Insight&quot;, so the main ID</text><text x="59.75" y="124" fill="rgb(218, 218, 218)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="15px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="224.9" lengthAdjust="spacing" xml:space="preserve">changes from &quot;idea&quot; to &quot;insight&quot;.</text><text x="59.75" y="147.5" fill="rgb(218, 218, 218)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="15px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="180.57" lengthAdjust="spacing" xml:space="preserve">You removed the ID &quot;test&quot;.</text><text x="41" y="177" fill="rgb(218, 218, 218)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="15px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="232.93" lengthAdjust="spacing" xml:space="preserve">This affects 16 callouts in 5 notes.</text><text x="41" y="196.5" fill="rgb(218, 218, 218)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="15px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="266.01" lengthAdjust="spacing" xml:space="preserve">What should happen to those callouts?</text><rect x="41" y="211" width="526" height="58.3" rx="8" fill="rgba(47.82, 44.16, 56.37, 1)" /><text x="53" y="236" fill="rgb(218, 218, 218)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="15px" font-weight="600" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="164.39" lengthAdjust="spacing" xml:space="preserve">Leave them as they are</text><text x="53" y="254.5" fill="rgb(179, 179, 179)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="12px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="318.5" lengthAdjust="spacing" xml:space="preserve">They keep their old IDs and fall back to the default style.</text><rect x="537" y="231.14" width="18" height="18" rx="9" fill="rgb(138, 92, 245)" /><rect x="537.5" y="231.64" width="17" height="17" rx="8.5" fill="none" stroke="rgb(138, 92, 245)" stroke-width="1"/><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="rgb(255, 255, 255)" stroke-width="3px" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero" opacity="1" transform="matrix(0.5 0 0 0.5 540 234.140625)"><path d="M20 6 9 17l-5-5" fill="none" stroke="rgb(255, 255, 255)" stroke-width="3px" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero" opacity="1"/></g><rect x="41" y="275.3" width="526" height="58.3" rx="8" fill="rgb(40, 40, 40)" /><text x="53" y="300.3" fill="rgb(218, 218, 218)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="15px" font-weight="600" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="113.92" lengthAdjust="spacing" xml:space="preserve">Change them to</text><text x="53" y="318.8" fill="rgb(179, 179, 179)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="12px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="256.91" lengthAdjust="spacing" xml:space="preserve">Every old ID in your notes becomes [!insight].</text><rect x="537.5" y="295.94" width="17" height="17" rx="8.5" fill="none" stroke="rgb(102, 102, 102)" stroke-width="1"/><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="rgba(0, 0, 0, 0)" stroke-width="3px" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero" opacity="1" transform="matrix(0.5 0 0 0.5 540 298.4375)"><path d="M20 6 9 17l-5-5" fill="none" stroke="rgba(0, 0, 0, 0)" stroke-width="3px" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero" opacity="1"/></g><rect x="433.59" y="286.44" width="91.41" height="36" rx="5" fill="rgb(51, 51, 51)" /><rect x="434.09" y="286.94" width="90.41" height="35" rx="4.5" fill="none" stroke="rgb(51, 51, 51)" stroke-width="1"/><g clip-path="url(#clip-1)"><text x="444.59" y="309.44" fill="rgb(218, 218, 218)" font-family="&quot;??&quot;, &quot;??&quot;, &quot;??&quot;, ui-sans-serif, -apple-system, &quot;system-ui&quot;, system-ui, &quot;Segoe UI&quot;, &quot;Google Sans Flex&quot;, Roboto, &quot;Inter Variable&quot;, Inter, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif" font-size="13px" font-weight="400" font-style="normal" direction="ltr" unicode-bidi="embed" letter-spacing="0" textLength="40.57" lengthAdjust="spacing" xml:space="preserve">insight</text></g><g clip-path="url(#clip-2)"></g><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="rgb(179, 179, 179)" stroke-width="2px" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero" opacity="1" transform="matrix(0.5833333333333334 0 0 0.5833333333333334 500 297.4375)"><path d="m7 15 5 5 5-5" fill="none" stroke="rgb(179, 179, 179)" stroke-width="2px" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero" opacity="1"/><path d="m7 9 5-5 5 5" fill="none" stroke="rgb(179, 179, 179)" stroke-width="2px" stroke-linecap="round" stroke-linejoin="round" fill-rule="nonzero" clip-rule="nonzero" opacity="1"/></g></g></g></svg>
